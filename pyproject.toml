[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-gw"
version = "0.0.1"
description = "A modern reimplementation of Dietrich Dörner's PSI theory, extended with a global workspace."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alec Sproten" }]
license = "MIT"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
mujoco = [
    "mujoco==3.3.7",
]
dev = [
    "pytest>=8",
]
paper = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_perception.py and tests/picrawler/test_perception.py share a
# basename; importlib mode lets both be collected without package files.
addopts = "--import-mode=importlib"
